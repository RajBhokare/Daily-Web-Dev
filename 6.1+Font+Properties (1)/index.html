<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>CSS Properties</title>

  <!-- Import Google Font (Caveat) -->
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400&display=swap" rel="stylesheet">

  <style>
    /* Root font size (30px as per TODO) */
    html {
      font-size: 30px;
    }

    body {
      background-color: cornflowerblue;
      color: white;
      font-size: 18px;
    }

    /* ✅ Your CSS below (following TODOs) */
    #p-1 {
      color: coral;
    }

    #p-2 {
      font-size: 2rem;
      /* 2x root font size = 60px */
    }

    #p-3 {
      font-weight: 900;
    }

    #p-4 {
      font-family: 'Caveat', cursive;
      font-weight: 400;
    }

    #p-5 {
      text-align: right;
    }
  </style>
</head>

<body>
  <h1>Important CSS Properties</h1>
  <p id="p-1">Color</p>
  <p id="p-2">Font Size</p>
  <p id="p-3">Font Weight</p>
  <p id="p-4">Font Family</p>
  <p id="p-5">Text Align</p>
</body>

</html>
